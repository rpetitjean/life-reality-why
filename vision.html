<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Vision of Life</title>
		<script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
		<style>
			html,
			body {
				margin: 0;
				width: 100%;
				height: 100%;
				overflow: hidden;
				background: #000;
			}

			#hud {
				position: fixed;
				inset: 0;
				z-index: 10;
				pointer-events: none;
			}

			#controls {
				position: fixed;
				bottom: 24px;
				right: 24px;
				display: flex;
				gap: 10px;
				pointer-events: auto;
			}

			#start,
			#vrButton {
				border: 1px solid #fff;
				background: rgba(20, 20, 20, 0.78);
				color: #fff;
				font: 600 14px/1.2 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
				padding: 10px 16px;
				border-radius: 999px;
				cursor: pointer;
				backdrop-filter: blur(8px);
				-webkit-backdrop-filter: blur(8px);
			}

			#vrButton {
				background: linear-gradient(135deg, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0.08));
			}

			.a-enter-vr,
			.a-enter-ar,
			.a-orientation-modal,
			.a-modal {
				display: none !important;
			}

			#tagline {
				position: fixed;
				left: 50%;
				bottom: 24px;
				transform: translateX(-50%);
				color: rgba(255, 255, 255, 0.9);
				font: 500 16px/1.2 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
				letter-spacing: 0.08em;
				text-transform: lowercase;
				text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
				pointer-events: none;
			}

			body.is-vr #hud {
				display: none;
			}
		</style>
	</head>
	<body>
		<div id="hud">
			<div id="controls">
				<button id="start" type="button">Start video</button>
				<button id="vrButton" type="button">Enter VR</button>
			</div>
			<div id="tagline">vision of life</div>
		</div>

		<a-scene
			renderer="colorManagement: true; antialias: true"
			vr-mode-ui="enabled: false"
			webxr="requiredFeatures: local-floor; optionalFeatures: hand-tracking, bounded-floor"
		>
			<a-assets>
				<video
					id="VID"
					src="https://video-assets-r.b-cdn.net/VID_20230925_192153_00_030.mp4"
					preload="auto"
					crossorigin="anonymous"
					loop
					muted
					playsinline
					webkit-playsinline
				></video>
			</a-assets>

<a-videosphere src="#VID" rotation="-13.42 135.12 -16.86"></a-videosphere>

			<a-entity camera look-controls wasd-controls-enabled="false" position="0 1.6 0"></a-entity>

			<a-entity
				id="leftHand"
				hand-tracking-controls="hand: left; modelStyle: mesh; modelColor: #ffffff"
				hand-controls="hand: left; handModelStyle: highPoly; color: #ffffff"
			></a-entity>

			<a-entity
				id="rightHand"
				hand-tracking-controls="hand: right; modelStyle: mesh; modelColor: #ffffff"
				hand-controls="hand: right; handModelStyle: highPoly; color: #ffffff"
			></a-entity>
		</a-scene>

		<script>
			const video = document.getElementById('VID');
			const scene = document.querySelector('a-scene');
			const startButton = document.getElementById('start');
			const vrButton = document.getElementById('vrButton');

			async function startVideo() {
				try {
					await video.play();
					startButton.style.display = 'none';
				} catch (error) {
					startButton.textContent = 'Tap to enable video';
				}
			}

			async function enterVr() {
				if (!scene || typeof scene.enterVR !== 'function') {
					return;
				}

				try {
					await scene.enterVR();
				} catch (error) {
					vrButton.textContent = 'VR unavailable';
				}
			}

			async function updateVrButtonVisibility() {
				const hasAframe = typeof AFRAME !== 'undefined' && AFRAME.utils && AFRAME.utils.device;
				const isHeadsetDevice = hasAframe && (
					AFRAME.utils.device.isMobileVR() || AFRAME.utils.device.checkHeadsetConnected()
				);

				let supportsImmersiveVr = false;
				if (navigator.xr && typeof navigator.xr.isSessionSupported === 'function') {
					try {
						supportsImmersiveVr = await navigator.xr.isSessionSupported('immersive-vr');
					} catch (error) {
						supportsImmersiveVr = false;
					}
				}

				vrButton.style.display = isHeadsetDevice && supportsImmersiveVr ? 'inline-flex' : 'none';
			}

			function syncUiWithVrState() {
				document.body.classList.toggle('is-vr', scene.is('vr-mode'));
			}

			startButton.addEventListener('click', startVideo);
			vrButton.addEventListener('click', enterVr);
			scene.addEventListener('enter-vr', syncUiWithVrState);
			scene.addEventListener('exit-vr', syncUiWithVrState);
			document.addEventListener('DOMContentLoaded', startVideo, { once: true });
			document.addEventListener('DOMContentLoaded', syncUiWithVrState, { once: true });
			document.addEventListener('DOMContentLoaded', updateVrButtonVisibility, { once: true });
		</script>
	</body>
</html>
